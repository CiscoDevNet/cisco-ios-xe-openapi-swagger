<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Model-Driven Telemetry — Cisco IOS-XE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg:#fafafa; --fg:#222; --card:#fff; --border:#e0e0e0; --accent:#1565C0;
          --hot:#c62828; --warm:#f57c00; --cool:#1976d2; --muted:#888; }
  body.dark { --bg:#181a1f; --fg:#e8e8e8; --card:#23262d; --border:#3a3d44; --accent:#64b5f6; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { background:linear-gradient(135deg,#1976D2 0%,#1565C0 100%); color:#fff;
           padding:24px 20px; text-align:center; }
  header h1 { margin:0 0 6px; font-size:1.6rem; }
  header p  { margin:0; opacity:.85; font-size:.9rem; }
  .nav { padding:10px 20px; background:var(--card); border-bottom:1px solid var(--border);
         text-align:center; }
  .nav a { color:var(--accent); text-decoration:none; margin:0 10px; font-weight:500; }
  main { max-width:1400px; margin:20px auto; padding:0 20px; }
  .picker { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .picker input, .picker select {
    padding:6px 10px; border:1px solid var(--border); border-radius:4px;
    background:var(--card); color:var(--fg);
  }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
           gap:10px; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:8px;
          padding:10px 14px; }
  .stat .num { font-size:1.4rem; font-weight:600; color:var(--accent); }
  .stat .lbl { font-size:.78rem; color:var(--muted); }
  .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:8px;
                overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
  th { position:sticky; top:0; background:var(--card); z-index:1; }
  td.xpath { font-family:"SF Mono",Consolas,monospace; font-size:.78rem; word-break:break-all; max-width:480px; }
  .tier { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.7rem;
          font-weight:600; color:#fff; }
  .tier.HOT  { background:var(--hot); }
  .tier.WARM { background:var(--warm); }
  .tier.COOL { background:var(--cool); }
  .badge { display:inline-block; padding:2px 6px; border-radius:4px; font-size:.7rem;
           background:var(--border); color:var(--fg); margin-right:4px; }
  a.spec-link { color:var(--accent); text-decoration:none; font-size:.78rem; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>📡 Model-Driven Telemetry — XPath Catalog</h1>
  <p>gRPC dial-out filter XPaths for Cisco IOS-XE oper YANG modules</p>
</header>
<div class="nav">
  <a href="index.html">← Hub</a>
  <a href="yang-accountability.html">YANG Report</a>
  <a href="yang-accountability-compare.html">Compare Versions</a>
  <a href="exports.html">Exports</a>
</div>
<main>
  <div class="picker">
    <label>Release:
      <select id="release"></select>
    </label>
    <input id="filter" type="search" placeholder="Filter xpath, module, summary…" style="flex:1;min-width:240px;">
    <select id="tier">
      <option value="">Any tier</option>
      <option value="HOT">HOT</option>
      <option value="WARM">WARM</option>
      <option value="COOL">COOL</option>
    </select>
    <select id="onchange">
      <option value="">on-change: any</option>
      <option value="true">on-change capable</option>
      <option value="false">cadence-only</option>
    </select>
  </div>
  <div id="stats" class="stats"></div>
  <div class="table-wrap">
    <table id="tbl">
      <thead><tr>
        <th>XPath</th><th>Module</th><th>Tier</th><th>Cadence</th>
        <th>Encoding</th><th>On-change</th><th>Spec</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div id="empty" class="empty" style="display:none;">No telemetry XPaths match the current filters.</div>
  </div>
</main>
<script>
(function () {
  var INDEX = null;

  fetch('releases/index.json', { cache:'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (data) {
      var releases = (data && data.releases) || [{ ver: '17.18.1', label: '17.18.1' }];
      var hashVer = (location.hash.match(/(?:^|[#&])ver=([^&]+)/) || [])[1];
      var stored = null;
      try { stored = localStorage.getItem('iosxe-active-version'); } catch (_) {}
      var current = hashVer || stored || (data && data.default) || releases[0].ver;
      var sel = document.getElementById('release');
      releases.forEach(function (r) {
        var o = document.createElement('option');
        o.value = r.ver;
        o.textContent = (r.label || r.ver) + (r.status === 'planned' ? ' (planned)' : '');
        if (r.status === 'planned') o.disabled = true;
        if (r.ver === current) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () { loadIndex(sel.value); });
      ['filter', 'tier', 'onchange'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', draw);
      });
      loadIndex(current);
    });

  function loadIndex(ver) {
    fetch('releases/' + encodeURIComponent(ver) + '/telemetry-index.json',
          { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (data) {
        INDEX = data;
        if (!INDEX) {
          document.querySelector('#stats').innerHTML =
            '<div class="stat"><div class="num">—</div>' +
            '<div class="lbl">No telemetry-index.json for ' + escapeHtml(ver) + '</div></div>';
          document.querySelector('#tbl tbody').innerHTML = '';
          document.querySelector('#empty').style.display = 'block';
          return;
        }
        renderStats();
        draw();
      });
  }

  function renderStats() {
    var s = document.getElementById('stats');
    var entries = (INDEX && INDEX.entries) || [];
    var byTier = { HOT:0, WARM:0, COOL:0, OTHER:0 };
    var onChange = 0, modules = {};
    entries.forEach(function (e) {
      var t = (e.tier || '').toUpperCase();
      if (byTier[t] !== undefined) byTier[t]++; else byTier.OTHER++;
      if (e.on_change_capable) onChange++;
      if (e.module) modules[e.module] = true;
    });
    s.innerHTML =
      stat(entries.length, 'XPaths annotated') +
      stat(byTier.HOT,  'HOT') +
      stat(byTier.WARM, 'WARM') +
      stat(byTier.COOL, 'COOL') +
      stat(onChange,    'on-change') +
      stat(Object.keys(modules).length, 'modules');
  }
  function stat(n, l) {
    return '<div class="stat"><div class="num">' + n +
           '</div><div class="lbl">' + escapeHtml(l) + '</div></div>';
  }

  function draw() {
    var tb = document.querySelector('#tbl tbody');
    var emp = document.querySelector('#empty');
    tb.innerHTML = '';
    var entries = (INDEX && INDEX.entries) || [];
    var q = document.getElementById('filter').value.trim().toLowerCase();
    var tier = document.getElementById('tier').value;
    var oc = document.getElementById('onchange').value;
    var shown = 0;
    entries.forEach(function (e) {
      if (tier && (e.tier || '').toUpperCase() !== tier) return;
      if (oc === 'true' && !e.on_change_capable) return;
      if (oc === 'false' && e.on_change_capable) return;
      if (q) {
        var hay = ((e.xpath || '') + ' ' + (e.module || '') + ' '
                   + (e.summary || '') + ' ' + (e.feature_section || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return;
      }
      shown++;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="xpath">' + escapeHtml(e.xpath || '') + '</td>' +
        '<td>' + escapeHtml(e.module || '') + '</td>' +
        '<td>' + (e.tier ? '<span class="tier ' + escapeHtml((e.tier || '').toUpperCase()) +
                          '">' + escapeHtml(e.tier) + '</span>' : '') + '</td>' +
        '<td>' + (e.cadence_seconds ? escapeHtml(e.cadence_seconds + 's') : '') + '</td>' +
        '<td><span class="badge">' + escapeHtml(e.encoding || 'kvGPB') + '</span></td>' +
        '<td>' + (e.on_change_capable ? '✓' : '') + '</td>' +
        '<td>' + (e.spec_link
          ? '<a class="spec-link" href="' + escapeHtml(e.spec_link) + '">view</a>'
          : '') + '</td>';
      tb.appendChild(tr);
    });
    emp.style.display = shown ? 'none' : 'block';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
})();
</script>
</body>
</html>
