<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco IOS-XE 17.18 - Operational State APIs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui.css" integrity="sha384-KX9Rx9vM1AmUNAn07bPAiZhFD4C8jdNgG6f5MRNvR+EfAxs2PmMFtUUazui7ryZQ" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: #fafafa; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #049fd9 0%, #0070c9 100%); color: white; padding: 20px 40px; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .nav-bar { background: #1b1b1b; padding: 10px 40px; display: flex; gap: 20px; flex-wrap: wrap; }
        .nav-bar a { color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-size: 13px; transition: background 0.2s; }
        .nav-bar a:hover { background: #333; }
        .nav-bar a.active { background: #049fd9; }
        .container { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 320px; background: white; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px 20px; background: #f5f5f5; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; }
        .sidebar-header h3 { font-size: 14px; color: #333; }
        .search-box { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; margin-top: 10px; }
        .stats { display: flex; gap: 30px; padding: 16px 20px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; }
        .stat { text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #049fd9; }
        .stat-label { font-size: 12px; color: #666; }
        .module-list { list-style: none; flex: 1; overflow-y: auto; }
        .module-list li { border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
        .module-list a { display: block; padding: 12px 20px; color: #333; text-decoration: none; font-size: 13px; transition: background 0.2s; flex: 1; }
        .module-list a:hover { background: #f5f8ff; }
        .module-list a.selected { background: #e3f2fd; border-left: 3px solid #049fd9; font-weight: 500; }
        .tree-link { padding: 8px 12px; color: #4CAF50; text-decoration: none; font-size: 11px; white-space: nowrap; transition: color 0.2s; }
        .tree-link:hover { color: #388E3C; text-decoration: underline; }
        .main-content { flex: 1; overflow: hidden; }
        #swagger-ui { height: 100%; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Cisco IOS-XE 17.18.1 - Operational State APIs</h1>
        <p>Real-time operational data via RESTCONF - Read-only GET operations for monitoring and telemetry</p>
    </div>
    
    <nav class="nav-bar">
        <a href="../index.html">Home</a>
        <a href="../swagger-oper-model/index.html" class="active">Operational</a>
        <a href="../swagger-rpc-model/index.html">RPC</a>
        <a href="../swagger-cfg-model/index.html">Config</a>
        <a href="../swagger-native-config-model/index.html">Native</a>
        <a href="../swagger-openconfig-model/index.html">OpenConfig</a>
        <a href="../swagger-ietf-model/index.html">IETF</a>
        <a href="../swagger-mib-model/index.html">MIB</a>
        <a href="../swagger-events-model/index.html">Events</a>
        <a href="../swagger-other-model/index.html">Other</a>
        <a href="../yang-trees/" style="margin-left: auto; background: #4CAF50;">🌳 Tree Browser</a>
    </nav>
    
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Operational Modules</h3>
                <input type="text" class="search-box" id="moduleSearch" placeholder="Search modules..." oninput="filterModules()">
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="totalModules">0</div>
                    <div class="stat-label">Modules</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalPaths">0</div>
                    <div class="stat-label">Paths</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalOperations">0</div>
                    <div class="stat-label">Operations</div>
                </div>
            </div>
            <ul class="module-list" id="moduleList"></ul>
        </aside>
        
        <main class="main-content">
            <div id="downloadBar" style="display: none; padding: 10px 20px; background: #f0f7ff; border-bottom: 1px solid #e0e0e0; align-items: center; gap: 12px; flex-wrap: wrap;">
                <button onclick="downloadSpec()" style="padding: 8px 16px; background: #1565C0; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s;" onmouseover="this.style.background='#0D47A1'" onmouseout="this.style.background='#1565C0'">📥 Download JSON Spec</button>
                <span id="downloadLabel" style="color: #666; font-size: 0.85rem;"></span>
                <button onclick="copySpecUrl()" style="padding: 6px 12px; background: #757575; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: background 0.2s;" onmouseover="this.style.background='#616161'" onmouseout="this.style.background='#757575'" title="Copy spec URL to clipboard">📋 Copy URL</button>
            </div>
            <div id="swagger-ui"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui-bundle.js" integrity="sha384-cxafBeQ+zYROeFafGFxtFbnp1ICqeS9mG7+f0WWSHzhnrUvwg9Za5CCw6wgrHA7K" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui-standalone-preset.js" integrity="sha384-6DNyIQAo3wcTAtOv9yarCKSm1Vhxwkg5ZHgsQ9Y4gD1NuzRgK4+HmCyRbEKkpJ66" crossorigin="anonymous"></script>
    <script>
        let allModules = [];
        let swaggerUI = null;
        let availableTrees = new Set();
        
        async function loadModules() {
            try {
                try { const tr = await fetch('../yang-trees/tree-manifest.json'); availableTrees = new Set(await tr.json()); } catch(e) {}
                const response = await fetch('api/manifest.json');
                const manifest = await response.json();
                allModules = manifest.modules || [];
                document.getElementById('totalModules').textContent = allModules.length;
                document.getElementById('totalPaths').textContent = (manifest.total_paths || 0).toLocaleString();
                document.getElementById('totalOperations').textContent = (manifest.total_operations || 0).toLocaleString();
                renderModuleList(allModules);
                
                // Auto-load first module after short delay (only if no hash specified)
                if (allModules.length > 0 && !window.location.hash.includes('spec')) {
                    setTimeout(() => loadSpec(allModules[0]), 200);
                }
            } catch (error) {
                console.error('Error loading manifest:', error);
            }
        }
        
        function renderModuleList(modules) {
            const list = document.getElementById('moduleList');
            list.innerHTML = modules.map(mod => {
                const displayName = mod.replace('Cisco-IOS-XE-', '').replace('-oper', '');
                return `<li>
                    <a href="javascript:void(0)" onclick="loadSpec('${mod}')" id="mod-${mod}">${displayName}</a>
                    ${availableTrees.has(mod) ? `<a href="../yang-trees/${mod}.html" target="_blank" class="tree-link" title="View YANG Tree">🌳 Tree</a>` : ''}
                </li>`;
            }).join('');
        }
        
        function filterModules() {
            const search = document.getElementById('moduleSearch').value.toLowerCase();
            const filtered = allModules.filter(mod => mod.toLowerCase().includes(search));
            renderModuleList(filtered);
        }
        
        function loadSpec(moduleName) {
            showDownloadBar(typeof moduleName === "object" ? moduleName.name || moduleName : moduleName);
            console.log('Loading spec:', moduleName);
            
            // Update selection
            document.querySelectorAll('.module-list a').forEach(a => a.classList.remove('selected'));
            const link = document.getElementById('mod-' + moduleName);
            if (link) link.classList.add('selected');
            
            // Initialize Swagger UI
            swaggerUI = SwaggerUIBundle({
                url: `api/${moduleName}.json`,
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: 'StandaloneLayout',
                deepLinking: true
            });
        }
        
        // Auto-load spec from hash fragment (for deep linking from search)
        function checkAndLoadFromHash() {
            let hash = decodeURIComponent(window.location.hash);
            // Remove leading # and any slashes
            hash = hash.replace(/^#\/?/, '#');
            if (hash.startsWith('#spec=')) {
                const moduleName = hash.replace('#spec=', '');
                if (moduleName) {
                    console.log('Deep linking to module:', moduleName);
                    setTimeout(() => loadSpec(moduleName), 100);
                }
            }
        }
        
        // Check on page load
        window.addEventListener('DOMContentLoaded', checkAndLoadFromHash);
        
        // Check on hash change (for navigation within the page)
        window.addEventListener('hashchange', checkAndLoadFromHash);
        
        // Also check immediately in case DOM is already loaded
        if (document.readyState === 'loading') {
            // Still loading
        } else {
            // DOM already loaded
            checkAndLoadFromHash();
        }
        
        loadModules();

        // Download / copy spec functions
        let currentModule = null;
        
        function downloadSpec() {
            if (!currentModule) return;
            const specUrl = `api/${currentModule}.json`;
            const a = document.createElement('a');
            a.href = specUrl;
            a.download = currentModule + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        
        function copySpecUrl() {
            if (!currentModule) return;
            const fullUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'api/' + currentModule + '.json';
            navigator.clipboard.writeText(fullUrl).then(() => {
                const btn = event.target;
                const orig = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => { btn.textContent = orig; }, 1500);
            });
        }
        
        function showDownloadBar(moduleName) {
            currentModule = moduleName;
            const bar = document.getElementById('downloadBar');
            if (bar) {
                bar.style.display = 'flex';
                document.getElementById('downloadLabel').textContent = moduleName + '.json';
            }
        }
    </script>
</body>
</html>
