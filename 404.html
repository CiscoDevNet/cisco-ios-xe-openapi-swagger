        p { color: var(--text-muted); font-size: 18px; margin-bottom: 20px; }
        .main-link {
            display: inline-block;
            padding: 12px 24px;
            background: var(--link-bg);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        .main-link:hover { opacity: 0.9; }
        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.1);

        .quick-links a {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-decoration: none;
            color: white;
            transition: opacity 0.2s;
