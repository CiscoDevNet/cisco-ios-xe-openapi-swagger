<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: white;
            --text: #333;
            --text-muted: #666;
            --link-bg: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
        }
        [data-theme="dark"] {
            --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --card-bg: #2d2d2d;
            --text: #e0e0e0;
            --text-muted: #b0b0b0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: background 0.3s;
        }
        .container {
            background: var(--card-bg);
            padding: 40px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            transition: background 0.3s;
        }
        h1 { color: #1e88e5; font-size: 48px; margin-bottom: 10px; }
        p { color: var(--text-muted); font-size: 18px; margin-bottom: 20px; }
        .main-link {
            display: inline-block;
            padding: 12px 24px;
            background: var(--link-bg);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        .main-link:hover { opacity: 0.9; }
        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }
        .quick-links a {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-decoration: none;
            color: white;
            transition: opacity 0.2s;
        }
        .quick-links a:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page not found. The documentation you're looking for doesn't exist.</p>
        <a href="index.html" class="main-link">← Back to Documentation Hub</a>
        <div class="quick-links">
            <a href="swagger-oper-model/index-v2.html" style="background: #2196F3;">Oper</a>
            <a href="swagger-cfg-model/index-v2.html" style="background: #00BCD4;">Config</a>
            <a href="swagger-native-config-model/index-v2.html" style="background: #4CAF50;">Native</a>
            <a href="swagger-rpc-model/index-v2.html" style="background: #FFC107; color: #333;">RPC</a>
            <a href="swagger-mib-model/index-v2.html" style="background: #9C27B0;">MIB</a>
            <a href="swagger-openconfig-model/index-v2.html" style="background: #009688;">OpenConfig</a>
            <a href="swagger-ietf-model/index-v2.html" style="background: #FF5722;">IETF</a>
            <a href="code-generator.html" style="background: #667eea;">⚡ Code Gen</a>
            <a href="yang-trees/" style="background: #388E3C;">🌳 Trees</a>
        </div>
    </div>
    <script>
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    </script>
</body>
</html>
