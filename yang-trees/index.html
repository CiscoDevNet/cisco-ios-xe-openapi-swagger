<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YANG Trees — redirecting…</title>
<meta name="robots" content="noindex">
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:520px;margin:80px auto;padding:0 20px;color:#333;line-height:1.5}a{color:#1565c0}</style>
</head>
<body>
<h1>YANG Trees</h1>
<p id="msg">Redirecting to the current release's tree browser…</p>
<p><a id="fallback" href="../releases/">Browse releases manually</a> if the redirect does not fire.</p>
<script>
// The top-level yang-trees/ directory no longer holds tree files — each
// release ships its own under releases/<ver>/yang-trees/. This stub bounces
// to the default release so existing hub links (href="yang-trees/") keep
// working without hard-coding a version on every caller page.
(function () {
    fetch('../releases/index.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
            var def = data && data['default'];
            if (!def) throw new Error('no default version');
            var target = '../releases/' + encodeURIComponent(def) + '/yang-trees/' + window.location.search + window.location.hash;
            document.getElementById('fallback').href = target;
            window.location.replace(target);
        })
        .catch(function (e) {
            var msg = document.getElementById('msg');
            if (msg) msg.textContent = 'Could not resolve default release: ' + e.message + '. Pick a release below.';
        });
})();
</script>
</body>
</html>
