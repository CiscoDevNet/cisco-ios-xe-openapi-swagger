name: HTML Lint (htmlhint)

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - ".htmlhintrc"
      - ".github/workflows/htmlcheck.yml"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install htmlhint
        run: npm install --no-save --silent htmlhint@1.x

      - name: Run htmlhint
        run: |
          # Lint top-level pages plus the nine swagger viewer index pages.
          # Archive/ and per-release HTML are excluded deliberately —
          # those are historical artifacts not part of the live surface.
          npx --no-install htmlhint \
            --config .htmlhintrc \
            "*.html" \
            "swagger-*-model/index.html"
