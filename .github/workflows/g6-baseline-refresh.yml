name: G-6 baseline refresh

# Weekly check: regenerate scripts/release_counts.json from the current state
# of releases/**. If the regenerated baseline differs from the committed one,
# open (or update) a PR with the diff so a human reviews whether the change
# is an intentional model addition or a silent regression.
#
# This closes the loop on G-6: the count guard fails the build on drops, but
# someone still has to bump the baseline when a real new release lands. This
# cron makes that bump a reviewable PR instead of a forgotten chore.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Regenerate baseline
        run: |
          python3 -X utf8 scripts/release_counts.py --write

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- release_counts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No baseline changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "--- baseline diff ---"
            git --no-pager diff -- release_counts.json | head -200
          fi

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: g6/baseline-refresh
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reset the branch to current main + the new baseline (force-push is safe:
          # branch is bot-owned and only this workflow writes to it).
          git checkout -B "$BRANCH"
          git add release_counts.json
          git commit -m "chore(g6): refresh release_counts.json baseline"
          git push --force-with-lease origin "$BRANCH"

          BODY=$(cat <<'EOF'
          Automated weekly refresh of the G-6 API/operation/module count
          baseline (`release_counts.json`).

          **Review checklist:**
          - [ ] Specs / paths / operations counts moved in the expected direction
          - [ ] Any *dropped* modules listed below are intentional renames or removals
          - [ ] If totals dropped, confirm `scripts/release_counts.py --check` was
                expected to fail before this refresh

          See `ASSURANCE_SPEC.md` §3 G-6 and `scripts/release_counts.py`.

          > _Note: this PR was opened by `GITHUB_TOKEN`, so PR-triggered
          > workflows (CI, lychee, lighthouse) will **not** run automatically.
          > If you want them, push an empty commit to this branch or close +
          > reopen the PR._
          EOF
          )

          # If a PR already exists for this branch, the push above updated it.
          # Otherwise, open a new one.
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(g6): weekly release_counts.json baseline refresh" \
              --label automation \
              --label g6 \
              --body "$BODY"
          else
            echo "PR for $BRANCH already exists; branch was force-updated."
          fi
