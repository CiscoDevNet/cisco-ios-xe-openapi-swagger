name: tests

on:
  # Every push: security/precache/export/harness guards cover HTML, JS, CSS and scripts.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install --no-cache-dir pytest requests PyYAML
      - name: Run repo + harness tests
        run: python -X utf8 -m pytest tests/ scripts/harness/tests/ -v
