name: tests

on:
  # Every push: security/precache/export/harness guards cover HTML, JS, CSS and scripts.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install --no-cache-dir pytest requests PyYAML
      - name: Run repo + harness tests
        run: python -X utf8 -m pytest tests/ scripts/harness/tests/ -v
