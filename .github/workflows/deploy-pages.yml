name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        
      - name: Prepare deployment directory
        run: |
          # Create a clean deployment directory
          mkdir -p deploy
          
          # Copy only necessary files for the website (exclude heavy references and scripts)
          echo "Copying model directories..."
          cp -r swagger-*-model deploy/ 2>/dev/null || true
          
          echo "Copying YANG trees..."
          cp -r yang-trees deploy/ 2>/dev/null || true
          
          echo "Copying docs..."
          cp -r docs deploy/ 2>/dev/null || true
          
          echo "Copying root files..."
          # Copy root HTML files and config
          cp *.html deploy/ 2>/dev/null || true
          cp *.json deploy/ 2>/dev/null || true
          cp *.md deploy/ 2>/dev/null || true
          cp .nojekyll deploy/ 2>/dev/null || true
          
          # Exclude heavy directories
          echo "Excluding references, archive, generators, scripts from deployment..."
          
          # Show deployment size for debugging
          echo "=== Deployment Summary ==="
          du -sh deploy
          echo "Total files to deploy:"
          find deploy -type f | wc -l
          echo "Deployment directory structure:"
          ls -lah deploy/
          
      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'deploy'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
