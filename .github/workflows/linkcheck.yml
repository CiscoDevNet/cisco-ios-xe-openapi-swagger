name: Link check

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.md"
      - ".github/workflows/linkcheck.yml"
  schedule:
    # Weekly Monday 06:00 UTC — catches link rot in external references
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Scan all HTML and Markdown plus the sitemap, skip heavy
          # generator / archive / release artifact trees that contain
          # gigabytes of unrelated content.
          args: >-
            --no-progress
            --max-concurrency 8
            --accept '200,206,301,302,403,429'
            --timeout 20
            --max-retries 2
            --exclude 'localhost'
            --exclude 'example\.(com|org)'
            --exclude '127\.0\.0\.1'
            --exclude-path '(^|/)scripts/'
            './**/*.html'
            './**/*.md'
            './sitemap.xml'
          fail: true
          output: lychee-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: ignore
